name: CI

on:
  push:
    branches: [main, dev, prod]
  pull_request:
    branches: [main, dev, prod]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · typecheck · test · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Stylelint
        run: npm run lint:styles

      - name: Typecheck
        run: npm run typecheck

      - name: Dependency boundaries
        run: npm run depcruise

      - name: i18n parity
        run: npm run i18n:check

      - name: Unit tests
        run: npm test

      - name: Build admin
        run: npm run build:admin

      - name: Build Storybook
        run: npm run build-storybook

      - name: Storybook a11y (axe test-runner)
        run: npm run storybook:a11y
        env:
          STORYBOOK_A11Y_REBUILD: '0'
          CI: true

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E (admin)
        run: npx nx e2e admin-e2e
        env:
          CI: true
