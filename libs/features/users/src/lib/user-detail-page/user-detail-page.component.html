<app-detail-page [breadcrumbs]="breadcrumbs()">
  <ng-container actions>
    @if (detail()) {
      @if (showBlock()) {
        <button app-button type="button" variant="secondary" size="md" [loading]="busy()" (click)="block()">
          {{ 'users.block' | transloco }}
        </button>
      }
      @if (showUnblock()) {
        <button app-button type="button" variant="secondary" size="md" [loading]="busy()" (click)="unblock()">
          {{ 'users.unblock' | transloco }}
        </button>
      }
      @if (showDelete()) {
        <button app-button type="button" variant="danger" size="md" [loading]="busy()" (click)="remove()">
          {{ 'users.delete' | transloco }}
        </button>
      }
    }
  </ng-container>

  @if (error() && !loading()) {
    <app-empty-state
      icon="alert-triangle"
      tone="danger"
      [title]="'users.errorTitle' | transloco"
      [description]="'users.errorHint' | transloco"
    >
      <button app-button variant="primary" type="button" (click)="reload()">
        {{ 'common.retry' | transloco }}
      </button>
    </app-empty-state>
  } @else if (isDeleted()) {
    <app-empty-state icon="user-x" [title]="'users.deleted' | transloco" />
  } @else if (loading()) {
    <app-detail-fields [fields]="[]" [loading]="true" />
  } @else if (detail()) {
    <app-detail-fields [fields]="fields()" />
  }
</app-detail-page>
