<div class="users-detail-page">
  <header class="users-detail-page__header">
    <a app-button variant="ghost" icon="arrow-left" routerLink="/users">
      {{ 'users.back' | transloco }}
    </a>
  </header>

  @if (loading()) {
    <app-skeleton height="12rem" />
  } @else if (user(); as u) {
    <app-card padding="lg">
      <div class="users-detail-page__profile">
        <entity-user-avatar [user]="u" size="xl" />
        <div>
          <h1 class="users-detail-page__title">{{ viewOf(u).fullName }}</h1>
          <p class="users-detail-page__subtitle">{{ u.email }}</p>
          <app-status [tone]="statusTone(u.status)">
            {{ 'users.statuses.' + u.status | transloco }}
          </app-status>
        </div>
      </div>
      <div class="users-detail-page__roles">
        <h2 class="users-detail-page__section-title">{{ 'users.roles' | transloco }}</h2>
        <div class="users-detail-page__actions">
          @for (role of u.roles; track role.id) {
            <entity-role-badge [role]="role" />
          } @empty {
            <span class="users-detail-page__empty">—</span>
          }
        </div>
      </div>
    </app-card>
  } @else {
    <app-empty-state
      icon="user-x"
      [title]="'users.empty' | transloco"
      [description]="'users.table.emptyDescription' | transloco"
    />
  }
</div>
