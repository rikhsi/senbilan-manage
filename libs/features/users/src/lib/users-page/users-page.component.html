<div class="users-page">
  <header class="users-page__header">
    <div>
      <p class="users-page__eyebrow">{{ 'users.eyebrow' | transloco }}</p>
      <h1 class="users-page__title">{{ 'users.title' | transloco }}</h1>
      <p class="users-page__subtitle">{{ 'users.subtitle' | transloco }}</p>
    </div>
    <button
      app-button
      type="button"
      variant="secondary"
      size="sm"
      icon="refresh"
      [loading]="loading()"
      (click)="reload()"
    >
      {{ 'common.retry' | transloco }}
    </button>
  </header>

  <div class="users-page__toolbar">
    <app-search-input
      search
      [placeholder]="'users.search' | transloco"
      [value]="search()"
      (search)="onSearch($event)"
    />
  </div>

  @if (error() && !loading() && rows().length === 0) {
    <app-empty-state
      icon="alert-triangle"
      tone="danger"
      [title]="'users.errorTitle' | transloco"
      [description]="'users.errorHint' | transloco"
    >
      <button app-button variant="primary" type="button" (click)="reload()">
        {{ 'common.retry' | transloco }}
      </button>
    </app-empty-state>
  } @else {
    <app-data-table
      [rows]="rows()"
      [columns]="columns()"
      [rowId]="rowId"
      [labels]="tableLabels()"
      [loading]="loading()"
      [error]="error() ? ('users.errorTitle' | transloco) : null"
      [rowClickable]="true"
      (rowClick)="onRowClick($event)"
      (retry)="reload()"
    >
      <ng-template appCell="name" let-row>
        <a [routerLink]="['/users', row.id]">{{ row.name || row.email || row.id }}</a>
      </ng-template>
      <ng-template appCell="status" let-row>
        <app-status [tone]="statusTone(row.status)">{{ row.status || '—' }}</app-status>
      </ng-template>
    </app-data-table>
  }
</div>
