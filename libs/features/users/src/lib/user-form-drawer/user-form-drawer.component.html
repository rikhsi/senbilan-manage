<app-dialog-shell
  [title]="(data.mode === 'create' ? 'users.create' : 'users.edit') | transloco"
  [closeLabel]="'users.close' | transloco"
>
  <form class="users-form-drawer" [formGroup]="form" (ngSubmit)="save()">
    <app-form-field [label]="'users.firstName' | transloco" required>
      <input appInput formControlName="firstName" autocomplete="given-name" />
    </app-form-field>
    <app-form-field [label]="'users.lastName' | transloco" required>
      <input appInput formControlName="lastName" autocomplete="family-name" />
    </app-form-field>
    @if (data.mode === 'create') {
      <app-form-field [label]="'users.email' | transloco" required>
        <input appInput type="email" formControlName="email" autocomplete="email" />
      </app-form-field>
    }
  </form>

  <ng-container footer>
    <button app-button type="button" variant="ghost" (click)="cancel()">
      {{ 'users.cancel' | transloco }}
    </button>
    <button app-button type="button" variant="primary" [loading]="saving()" (click)="save()">
      {{ 'users.save' | transloco }}
    </button>
  </ng-container>
</app-dialog-shell>
