<app-list-page [breadcrumbs]="breadcrumbs">
  <button actions app-button type="button" variant="secondary" size="md" icon="log-out" (click)="onLogout()">
    {{ 'profile.logout' | transloco }}
  </button>

  @if (navItems.length > 1) {
    <nav toolbar class="profile-shell__nav" [attr.aria-label]="'nav.profile' | transloco">
      @for (item of navItems; track item.id) {
        <a
          class="profile-shell__nav-link"
          [routerLink]="item.route"
          routerLinkActive="profile-shell__nav-link--active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <app-icon [name]="item.icon" size="sm" />
          <span>{{ item.labelKey | transloco }}</span>
        </a>
      }
    </nav>
  }

  <router-outlet />
</app-list-page>
