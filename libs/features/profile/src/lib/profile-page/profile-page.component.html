<div class="profile-page">
  <header class="profile-page__header">
    <div>
      <h1 class="profile-page__title">{{ 'profile.title' | transloco }}</h1>
      <p class="profile-page__subtitle">{{ 'profile.subtitle' | transloco }}</p>
    </div>
    <entity-user-avatar [name]="displayName()" [src]="model().avatarUrl || null" size="lg" />
  </header>

  <form class="profile-page__form" (submit)="save($event)" novalidate>
    <app-form-field [label]="'profile.firstName' | transloco" [error]="errorFor('firstName')" required>
      <input appInput [formField]="profileForm.firstName" autocomplete="given-name" />
    </app-form-field>
    <app-form-field [label]="'profile.lastName' | transloco" [error]="errorFor('lastName')" required>
      <input appInput [formField]="profileForm.lastName" autocomplete="family-name" />
    </app-form-field>
    <app-form-field [label]="'profile.email' | transloco">
      <input appInput type="email" [formField]="profileForm.email" autocomplete="email" />
    </app-form-field>
    <app-form-field [label]="'profile.avatarUrl' | transloco">
      <input appInput type="url" [formField]="profileForm.avatarUrl" />
    </app-form-field>
    <button app-button type="submit" variant="primary" [loading]="saving()">
      {{ 'profile.save' | transloco }}
    </button>
  </form>
</div>
