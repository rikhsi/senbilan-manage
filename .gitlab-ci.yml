# Verify on merge requests and on dev / main / prod.
# Those branches also build a Docker image and push it to the GitLab Container Registry.
# dev deploys to staging; main and prod deploy to production — only after DEPLOY_HOST is set.
#
# You configure in GitLab (this file does not):
#   - Runner with the Docker executor and a privileged docker:dind service
#   - Container Registry on the project
#   - CI/CD variables (mask secrets): DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH, DEPLOY_SSH_KEY
#     Scope them per environment (staging / production) when the servers differ.
#   - On the server: Docker, the deploy user in the docker group, and a `.env`
#     beside docker-compose.yml (see docker/env.example). API_BASE_URL stays there.

stages:
  - verify
  - image
  - deploy

variables:
  HUSKY: '0'
  NX_DAEMON: 'false'
  DOCKER_TLS_CERTDIR: '/certs'

default:
  interruptible: true

.deploy_rules:
  rules: &deploy_rules
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "prod"

verify:
  stage: verify
  image: node:22-bookworm
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run lint
    - npm run lint:styles
    - npm run typecheck
    - npm run depcruise
    - npm run i18n:check
    - npm test
    - npm run build:web
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "prod"

image:
  stage: image
  image: docker:27
  services:
    - docker:27-dind
  needs:
    - verify
  rules: *deploy_rules
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build --pull -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG" -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

.deploy:
  stage: deploy
  image: alpine:3.21
  needs:
    - image
  interruptible: false
  resource_group: deploy-$CI_ENVIRONMENT_NAME
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
    - chmod 600 ~/.ssh/id_deploy
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - test -n "$DEPLOY_HOST"
    - test -n "$DEPLOY_USER"
    - test -n "$DEPLOY_PATH"
    - test -n "$DEPLOY_SSH_KEY"
    - ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
    - scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.yml"
    - printf '%s\n' "$CI_REGISTRY_PASSWORD" | ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY' && CI_REGISTRY_IMAGE='$CI_REGISTRY_IMAGE' IMAGE_TAG='$CI_COMMIT_REF_SLUG' docker compose pull && CI_REGISTRY_IMAGE='$CI_REGISTRY_IMAGE' IMAGE_TAG='$CI_COMMIT_REF_SLUG' docker compose up -d --remove-orphans"

deploy:staging:
  extends: .deploy
  environment:
    name: staging
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" && $DEPLOY_HOST

deploy:production:
  extends: .deploy
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == "prod" && $DEPLOY_HOST
    - if: $CI_COMMIT_BRANCH == "main" && $DEPLOY_HOST
