<ion-content [fullscreen]="true" class="mobile-login">
  <div class="mobile-login__prefs">
    <app-locale-toggle />
    <app-theme-toggle />
  </div>

  <div class="mobile-login__shell">
    <div class="mobile-login__visual" aria-hidden="true">
      <auth-orbit-hero />
    </div>

    <div class="mobile-login__panel">
      <header class="mobile-login__header">
        <h1 class="mobile-login__title">{{ 'auth.title' | transloco }}</h1>
        <p class="mobile-login__subtitle">{{ 'auth.subtitle' | transloco }}</p>
      </header>

      <form class="mobile-login__form" [formGroup]="form" (ngSubmit)="onSubmit()" autocomplete="on" novalidate>
        <app-form-field [label]="'auth.phone' | transloco" [invalid]="!!phoneError()" required>
          <input
            appInput
            id="login-phone"
            name="phone"
            formControlName="phone"
            type="tel"
            autocomplete="tel-national"
            inputmode="numeric"
            maxlength="20"
            [attr.readonly]="phoneLockAutofill() ? '' : null"
            [mask]="phoneMask"
            [prefix]="phonePrefix"
            [dropSpecialCharacters]="false"
            [showMaskTyped]="false"
            (focus)="unlockPhoneAutofill()"
          />
        </app-form-field>

        <app-form-field [label]="'auth.password' | transloco" [invalid]="!!passwordError()" required>
          <div class="mobile-login__password-control">
            <input
              appInput
              id="login-password"
              name="password"
              formControlName="password"
              [type]="showPassword() ? 'text' : 'password'"
              autocomplete="current-password"
            />
            <ion-button
              fill="clear"
              type="button"
              class="mobile-login__password-toggle"
              [attr.aria-label]="(showPassword() ? 'auth.hidePassword' : 'auth.showPassword') | transloco"
              (click)="togglePassword()"
            >
              <ion-icon slot="icon-only" [name]="showPassword() ? 'eye-off-outline' : 'eye-outline'" />
            </ion-button>
          </div>
        </app-form-field>

        <ion-button type="submit" expand="block" color="primary" class="mobile-login__submit" [disabled]="submitting()">
          @if (submitting()) {
            <ion-spinner name="crescent" />
          } @else {
            <ion-icon slot="start" name="lock-closed-outline" />
            {{ 'auth.submit' | transloco }}
          }
        </ion-button>
      </form>
    </div>
  </div>
</ion-content>
