<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Senbilan Manage</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FBD2DC" />
    <link rel="icon" type="image/png" href="/assets/auth/splash_heart.png" />
    <link rel="apple-touch-icon" href="/assets/auth/splash_heart.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <style>
      /* Native splash before Angular boots — first stop of --app-gradient-aurora. */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        margin: 0;
        background: #fbd2dc;
        transition:
          opacity 350ms cubic-bezier(0.33, 1, 0.68, 1),
          visibility 350ms;
      }
      #app-splash.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #app-splash img {
        width: 2.5rem;
        height: 2.5rem;
        border-radius: 999px;
        object-fit: cover;
      }
      .app-splash__brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .app-splash__name {
        font-family: 'Inter Variable', 'Inter', system-ui, sans-serif;
        font-size: 1.375rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.2;
        color: #2d1a22;
      }
      .app-splash__lead {
        color: #ef4470;
      }
    </style>
    <!-- Theme bootstrap: apply data-theme before first paint (see ThemeService). -->
    <script>
      (function () {
        try {
          var key = 'senbilan.theme';
          var raw = localStorage.getItem(key);
          var prefs = raw ? JSON.parse(raw) : null;
          var root = document.documentElement;
          var mode = prefs && prefs.mode ? prefs.mode : 'system';
          if (mode === 'comfort') {
            mode = 'light';
            if (prefs) prefs.eyeComfort = true;
          }
          var theme =
            mode === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : mode;
          root.setAttribute('data-theme', theme);
          if (prefs) {
            if (prefs.density) root.setAttribute('data-density', prefs.density);
            if (prefs.contrast) root.setAttribute('data-contrast', prefs.contrast);
            if (prefs.motion) root.setAttribute('data-motion', prefs.motion);
            root.setAttribute('data-eye-comfort', prefs.eyeComfort ? 'on' : 'off');
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <div class="app-splash__brand">
        <img src="/assets/auth/brand_heart.png" alt="" width="40" height="40" />
        <span class="app-splash__name"><span class="app-splash__lead">Sen</span>Bilan</span>
      </div>
    </div>
    <web-root></web-root>
  </body>
</html>
